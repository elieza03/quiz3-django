<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory</title>
    <style>
        :root {
            --pink-soft: #fff0f5;
            --pink-light: #ffe4e1;
            --pink-accent: #ffb6c1;
            --pink-deep: #ff69b4;
            --pink-dark: #d87093;
            --text-dark: #5c3a42;
            --border-pink: #f8c8dc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(135deg, #fff5f8 0%, #ffe4e1 100%);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-container {
            width: 95%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            border: 3px solid var(--border-pink);
            position: relative;
        }

        .card-container::before {
            content: '🎀 ✨';
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            padding: 4px 18px;
            border-radius: 20px;
            border: 2px solid var(--pink-accent);
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3);
        }

        h1 {
            text-align: center;
            color: var(--pink-dark);
            font-size: 2.3rem;
            margin-top: 10px;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .table-wrapper {
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid var(--pink-accent);
            box-shadow: 0 5px 15px rgba(248, 200, 220, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
        }

        th {
            background: linear-gradient(90deg, #ffb6c1, #ffc0cb);
            color: #ffffff;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            text-shadow: 1px 1px 2px rgba(216, 112, 147, 0.4);
        }

        tr {
            border-bottom: 1px solid var(--pink-soft);
            transition: background-color 0.25s ease;
        }

        tr:nth-child(even) {
            background-color: #fffafc;
        }

        tr:hover {
            background-color: #ffe8ee;
        }

        td {
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .badge {
            display: inline-block;
            background-color: var(--pink-soft);
            color: var(--pink-dark);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid var(--border-pink);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--pink-dark);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1> Student Directory </h1>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Course</th>
                        <th>Year Level</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td><span class="badge">#{{ student.id }}</span></td>
                        <td><strong>{{ student.first_name }}</strong></td>
                        <td><strong>{{ student.last_name }}</strong></td>
                        <td>{{ student.course }}</td>
                        <td> {{ student.year_level }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="empty-state">
                            🌷 No student records found yet. Add records via Django Admin!
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
